name: daily-macro

# 每天 21:00 UTC = 北京时间次日 05:00
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-macro
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Crawl macro indicators
        run: python -m crawler.cloud.main

      - name: Commit data
        run: |
          git config user.name  "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data/latest.json data/series.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Purge jsDelivr cache
        run: |
          for f in latest series; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/${f}.json"
            echo "purge -> $url"
            curl -sS --max-time 30 "$url" || true
            echo
          done
